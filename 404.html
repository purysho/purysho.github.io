<title>Not found — Purysho</title>
<script>
  // Project sites moved when their repositories were renamed to match the
  // rest of the collection. Forward old and wrongly-cased paths, keeping any
  // deep path, query and hash (Lodestar's #/add?s=… links depend on the hash).
  (function () {
    var moved = {
      "github-treasure-hunt": "TreasureHunt",
      "open-question-atlas": "OpenQuestionAtlas",
      "lodestar": "Lodestar",
      "treasurehunt": "TreasureHunt",
      "openquestionatlas": "OpenQuestionAtlas",
      "cascade": "Cascade"
    };
    var parts = location.pathname.split("/");
    var target = moved[(parts[1] || "").toLowerCase()];
    if (target && parts[1] !== target) {
      parts[1] = target;
      location.replace(parts.join("/") + location.search + location.hash);
    }
  })();
</script>
